[main]
max_parallel_downloads=10
defaultyes=True

# fastestmirror picks the mirror with the lowest TCP latency, which has little
# to do with bandwidth, and it overrides the server-side mirrormanager ranking
# that already accounts for bandwidth and client location. Leaving it off is
# usually faster overall:
# https://discussion.fedoraproject.org/t/fastest-mirror/135493
#fastestmirror=True
